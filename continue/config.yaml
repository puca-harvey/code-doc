# yaml-language-server: $schema=file:///c%3A/Users/harvey/.continue/config-yaml-schema.json
# That file is the offline copy of the schema shipped with Continue 2.0.0
# (%USERPROFILE%\.vscode\extensions\continue.continue-2.0.0-win32-x64\config-yaml-schema.json).
# Refresh it after a Continue upgrade with:
#   Copy-Item "$env:USERPROFILE\.vscode\extensions\continue.continue-*\config-yaml-schema.json" "$env:USERPROFILE\.continue\"

name: Main Config
version: 1.0.0
schema: v1

models:
  # ---------------------------------------------------------
  # AUTOCOMPLETE MODEL: Qwen2.5‑Coder 14B
  # Used for tab completion only.
  # Ollama ships this model with a native fill-in-the-middle template
  # ("{{- if .Suffix }}<|fim_prefix|>...") and reports the "insert"
  # capability, so Continue uses the real FIM code path for tab
  # completion instead of the raw-prompt fallback. It is the only model
  # here that can do this, which is why autocomplete stays on the 14B
  # even though it is the slower of the two.
  # contextLength 8192 keeps the ~10 GB model fully resident on the
  # 12 GB RTX 5070; the machine-wide OLLAMA_CONTEXT_LENGTH=65536 would
  # otherwise be requested and push the model into CPU offload.
  # ---------------------------------------------------------
  - name: Qwen2.5-Coder 14B
    provider: ollama
    model: qwen2.5-coder:14b
    contextLength: 8192
    roles:
      - autocomplete # tab completion; needs native FIM

  # ---------------------------------------------------------
  # CHAT / EDIT / APPLY MODEL: Ornith 1.5 35B
  # (qwen35 architecture, ~35.5B total / ~3B active MoE, Q4_K_M,
  # 262k context, tool use, thinking and vision).
  # Handles the conversational and code-transform roles. It replaced
  # prior 9B Ornith 1.5 (superseded, no longer pulled locally). MoE:
  # only ~3B params are active at any moment, so that active footprint
  # fits comfortably in the 12 GB RTX 5070 VRAM; it is the ~22 GB total
  # (all expert weights on disk) that never all fits resident.
  # It cannot serve autocomplete: its Ollama Modelfile template is a
  # bare "{{ .Prompt }}" with no .Suffix, so Continue would fall back
  # to sending a raw "<|fim_prefix|>...<|fim_middle|>" prompt, which
  # the model continues past the insertion point into prose.
  # edit/apply are code transforms where Qwen2.5-Coder's training may
  # still win despite the speed; move those two roles back to it if
  # its edits feel stronger. That is a preference call - neither
  # model is measurably better at edits from here.
  # contextLength 65536 (matches the OLLAMA_CONTEXT_LENGTH=65536 env
  # default): it does not cap the 3B active weights (resident), but
  # it does size the KV cache, so 65536 tokens costs ~0.4 GB - small
  # and resident, and lets long chats/threads/diffs land in one
  # request without offloading. The 14B autocomplete STAYS at 8192 so
  # it never thrashes during tab completion.
  # ---------------------------------------------------------
  - name: Ornith 1.5 35B
    provider: ollama
    model: ornith-1.5:35b
    contextLength: 65536
    roles:
      - chat
      - edit
      - apply

  # ---------------------------------------------------------
  # EMBEDDING MODEL
  # Required for semantic search, context, navigation.
  # nomic-embed-text-v2-moe:latest replaced nomic-embed-text:latest:
  # 475M params (MoE, 305M active), 768 dims reducible to 256 via
  # Matryoshka, 512-token window, ~100 languages.
  # Continue embeds with POST /api/embed {model, input: [chunks]} and
  # this model answers it (verified: 2 x 768 unit-norm vectors).
  # Caveats: the model card recommends "search_document: " /
  # "search_query: " prefixes for best retrieval, which Continue does
  # not add, and the 512-token window is much shorter than
  # nomic-embed-text's 8192, so leave Continue's default chunk size
  # alone (Ollama truncates anything longer).
  # Changing embedder invalidates the stored index - rebuild it, and
  # pick this model for the Embed role in the model picker, because the
  # remembered selection is currently "Transformers.js (Built-In)".
  # ---------------------------------------------------------
  - name: Nomic Embed v2 MoE
    provider: ollama
    model: nomic-embed-text-v2-moe:latest
    roles:
      - embed
