# yaml-language-server: $schema=file:///c%3A/Users/harvey/.continue/config-yaml-schema.json
# That file is the offline copy of the schema shipped with Continue 2.0.0
# (%USERPROFILE%\.vscode\extensions\continue.continue-2.0.0-win32-x64\config-yaml-schema.json).
# Refresh it after a Continue upgrade with:
#   Copy-Item "$env:USERPROFILE\.vscode\extensions\continue.continue-*\config-yaml-schema.json" "$env:USERPROFILE\.continue\"

name: Main Config
version: 1.0.0
schema: v1

# NOTE: there is no top-level `autocomplete:` key in the Continue 2.0 YAML
# schema - it is rejected with "property autocomplete is not allowed". Tab
# completion options belong on the model entry, as `autocompleteOptions:`
# (see the autocomplete model below). Runtime precedence is:
#   DEFAULT_AUTOCOMPLETE_OPTS < config.tabAutocompleteOptions < model.autocompleteOptions

models:
  # ---------------------------------------------------------
  # AUTOCOMPLETE MODEL: DeepSeek-Coder-V2 16B
  # Used for tab completion only.
  # Ollama ships this model with a native fill-in-the-middle template
  # ("{{- if .Suffix }}<｜fim▁begin｜>...") and reports the "insert"
  # capability, so Continue uses the real FIM code path for tab
  # completion instead of the raw-prompt fallback. It is the only model
  # here with a FIM template, which is why autocomplete sits on it.
  # deepseek-coder-v2:16b is DeepSeek-Coder-V2-Lite-Instruct: a MoE
  # (deepseek2 architecture, 15.7B total / ~2.4B active, Q4_0, 8.9 GB
  # on disk).
  # contextLength 8192: measured on the 12 GB RTX 5070, the model loads
  # at ~11 GB and keeps ~91% on the GPU (~9% spills to CPU) with other
  # apps open, because its KV cache is much larger per token than
  # Qwen2.5-Coder's. Close other GPU apps for 100% GPU, or drop this to
  # 4096 (measured 10 GB, 100% GPU).
  # Clear any machine-wide OLLAMA_CONTEXT_LENGTH too (see 12GB.md),
  # because Ollama would otherwise request that value instead and push
  # more of the model into CPU offload.
  # ---------------------------------------------------------
  - name: DeepSeek-Coder-V2 16B
    provider: ollama
    model: deepseek-coder-v2:16b
    contextLength: 8192
    autocompleteOptions:
      # Continue's default budget is 1024 prompt tokens; raising it makes the
      # larger window actually useful. Keep it well under contextLength.
      maxPromptTokens: 2048
    roles:
      - autocomplete # tab completion; needs native FIM

  # ---------------------------------------------------------
  # CHAT / EDIT / APPLY MODEL: MiMo 2.6 9B
  # (MiMo-V2.6-Distill-Qwen-9B by Xiaomi MiMo; qwen35 architecture,
  # 9.0B params, Q4_K_M, ~6.6 GB, 262144 native context, tool use,
  # thinking and vision). Handles the conversational and code-transform
  # roles.
  #
  # It cannot serve autocomplete: its Ollama Modelfile template is a
  # bare "{{ .Prompt }}" with no .Suffix, so Continue would fall back
  # to sending a raw "<|fim_prefix|>...<|fim_middle|>" prompt, which
  # the model continues past the insertion point into prose.
  # edit/apply are code transforms where DeepSeek-Coder's training may
  # still win; move those two roles back to it if its edits feel
  # stronger. That is a preference call - neither model is measurably
  # better at edits from here.
  # contextLength 65536: it does not cap the weights, but it does size
  # the KV cache; measured 7.7 GB loaded and 100% GPU at 65536, so long
  # chats/threads/diffs land in one request without offloading. The
  # autocomplete model STAYS at 8192 so it never thrashes during tab
  # completion.
  # ---------------------------------------------------------
  - name: MiMo 2.6 9B
    provider: ollama
    model: mimo-v2.6:9b
    contextLength: 65536
    roles:
      - chat
      - edit
      - apply

  # ---------------------------------------------------------
  # EMBEDDING MODEL
  # Required for semantic search, context, navigation.
  # nomic-embed-text-v2-moe:latest replaced nomic-embed-text:latest:
  # 475M params (MoE, 305M active), 768 dims reducible to 256 via
  # Matryoshka, 512-token window, ~100 languages.
  # Continue embeds with POST /api/embed {model, input: [chunks]} and
  # this model answers it (verified: 2 x 768 unit-norm vectors).
  # Caveats: the model card recommends "search_document: " /
  # "search_query: " prefixes for best retrieval, which Continue does
  # not add, and the 512-token window is much shorter than
  # nomic-embed-text's 8192, so leave Continue's default chunk size
  # alone (Ollama truncates anything longer).
  # Changing embedder invalidates the stored index - rebuild it, and
  # pick this model for the Embed role in the model picker, because the
  # remembered selection is currently "Transformers.js (Built-In)".
  # ---------------------------------------------------------
  - name: Nomic Embed v2 MoE
    provider: ollama
    model: nomic-embed-text-v2-moe:latest
    roles:
      - embed
